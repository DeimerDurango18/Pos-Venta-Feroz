# Despliegue en producción (VPS) usando la imagen construida en CI.
# Uso:
#   docker compose -f docker-compose.yml -f compose.prod.yml --env-file .env.prod up -d
#
# - Caddy publica app.<dominio> (frontend) y api.<dominio> (backend) con HTTPS
#   automático (Let's Encrypt) y renueva los certificados solo.
# - La base de datos queda en el host del VPS, no se publica a internet.
# - El backend nunca se expone al host: solo Caddy lo alcanza por la red interna.
services:
  db:
    ports: []

  backend:
    container_name: pos_backend_prod
    image: ${REGISTRY:-ghcr.io}/${REGISTRY_ORG:-tudominio}/pos-backend:${TAG:-latest}
    build: !reset []
    restart: unless-stopped
    environment:
      DATABASE_URL: mssql+pyodbc://sa:${SA_PASSWORD}@db:1433/${DB_NAME:-posdb}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUG: "false"
    ports: []
    networks:
      - default
      - proxy

  frontend:
    container_name: pos_frontend_prod
    image: ${REGISTRY:-ghcr.io}/${REGISTRY_ORG:-tudominio}/pos-frontend:${TAG:-latest}
    build: !reset []
    restart: unless-stopped
    ports: []
    networks:
      - default
      - proxy

  caddy:
    image: caddy:2-alpine
    container_name: pos_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_API: ${DOMAIN_API}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    depends_on:
      - frontend
      - backend

networks:
  proxy:

volumes:
  caddy_data:
  caddy_config: